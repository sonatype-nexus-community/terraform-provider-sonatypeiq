# Terraform Provider testing workflow - Tier 3 (Protected Resources).
name: Test (Trusted)

# Dispatched runs always show the default branch in the Actions UI (the workflow file comes from there).
# The run title therefore states the commit that is actually checked out and tested.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Test (Trusted) - approved commit {0}', inputs.sha) || format('Test (Trusted) - default branch @ {0}', github.sha) }}

# Runs the acceptance tests, which need a licensed Sonatype IQ Server (Tier 3 of
# https://contribute.sonatype.com/docs/standards/pull-request-ci/). It holds secrets, so it only
# runs on pushes to the default branch, or on a commit a maintainer has approved with
# `/ok-to-test <sha>` (see approve-acceptance-tests.yml).
on:
    push:
        branches:
            - main
        paths-ignore:
            - 'CHANGELOG.md'
            - 'README.md'
    # Started by approve-acceptance-tests.yml once a maintainer has approved the commit
    workflow_dispatch:
        inputs:
            sha:
                description: 'Full commit SHA to test (must have an approved ok-to-test status)'
                required: true
                type: string
            pr:
                description: 'Pull Request number (a newer run for the same Pull Request cancels this one)'
                required: false
                type: string

permissions: {}

# One run per Pull Request: a newer commit cancels the run for the older one. Runs on the default
# branch are never cancelled; at most one queued run waits behind the running one.
concurrency:
    group: trusted-${{ inputs.pr && format('pr-{0}', inputs.pr) || inputs.sha && format('sha-{0}', inputs.sha) || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
    LC_APPLICATION_ID: terraform-provider-sonatypeiq
    # The licence lives outside the workspace (and the checked-out code)
    NXIQ_LICENSE_FILE: /home/runner/.nxiq-license/license.lic

jobs:
    # Authoritative Lifecycle evaluation (stage `build`) of the default branch
    sonatype:
        name: Sonatype Scan
        if: ${{ github.event_name == 'push' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
              with:
                  go-version-file: 'go.mod'
                  cache: true

            - name: Generate go.list
              run:
                  go list -f '{{define "M"}}{{.Path}} {{.Version}}{{end}}{{with .Module}}{{if not .Main}}{{if .Replace}}{{template "M" .Replace}}{{else}}{{template "M" .}}{{end}}{{end}}{{end}}' -compiled -deps| sort -u > go.list

            - name: Sonatype Lifecycle Evaluation
              id: evaluate
              uses: sonatype/actions/evaluate@bb9a9c738185a00853c399df3e54e3c11d4ea3b1 # v1.15.0
              with:
                  iq-server-url: ${{ vars.SONATYPE_PLATFORM_URL }}
                  username: ${{ secrets.SONATYPE_LIFECYCLE_USERNAME }}
                  password: ${{ secrets.SONATYPE_LIFECYCLE_PASSWORD }}
                  application-id: ${{ env.LC_APPLICATION_ID }}
                  scan-targets: 'go.list'
                  stage: build

    verify-approval:
        name: Verify Approval
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            statuses: read
        outputs:
            sha: ${{ steps.verify.outputs.sha }}
        env:
            GH_TOKEN: ${{ github.token }}
            REPO: ${{ github.repository }}
            INPUT_SHA: ${{ inputs.sha }}
            EVENT_NAME: ${{ github.event_name }}
            EVENT_SHA: ${{ github.sha }}
            SERVER_URL: ${{ github.server_url }}
        steps:
            - name: Verify the commit is approved
              id: verify
              run: |
                  if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
                    # push to the default branch: a trusted ref
                    echo "sha=${EVENT_SHA}" >> "$GITHUB_OUTPUT"; exit 0
                  fi
                  if ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                    echo "::error::sha must be a full 40 character commit SHA"; exit 1
                  fi
                  STATE=$(gh api "repos/${REPO}/commits/${INPUT_SHA}/status" \
                    --jq '[.statuses[] | select(.context == "ok-to-test")][0].state')
                  if [ "$STATE" != "success" ]; then
                    echo "::error::Commit ${INPUT_SHA} has no approved ok-to-test status (state: ${STATE:-none})"; exit 1
                  fi
                  echo "sha=${INPUT_SHA}" >> "$GITHUB_OUTPUT"
                  echo "Testing approved commit [\`${INPUT_SHA}\`](${SERVER_URL}/${REPO}/commit/${INPUT_SHA})" >> "$GITHUB_STEP_SUMMARY"

    # Run acceptance tests in a matrix with Terraform CLI versions (bundle-based for IQ 202-204)
    test-parallel:
        name: Acc. Tests (NXIQ ${{ matrix.nxiq }} + TF ${{ matrix.terraform }})
        needs:
            - verify-approval
            - sonatype
        # Pushes to the default branch: do not run the licensed tests if the Lifecycle scan fails.
        # Dispatched (approved Pull Request) runs skip the scan, which is not a failure.
        if: ${{ !cancelled() && needs.verify-approval.result == 'success' && (needs.sonatype.result == 'success' || needs.sonatype.result == 'skipped') }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: acceptance-tests
        permissions:
            contents: read
        env:
            TF_SAFE_VERSION: ${{ matrix.terraform }}
        strategy:
            fail-fast: false
            matrix:
                nxiq:
                    #- '1.192.0-01'
                    #- '1.193.0-01'
                    # - '1.194.0-01'
                    - '1.195.0-01'
                    - '1.196.0-01'
                    - '1.197.0-01'
                    - '1.198.0-01'
                    - '1.199.0-01'
                    - '1.200.0-01'
                    - '1.201.0-02'
                    - '1.202.2-01'
                    - '1.203.4-01'
                    - '1.204.4-03'
                # list whatever Terraform versions here you would like to support
                terraform:
                    - '1.0.*' # Minimum
                    # - '1.1.*'
                    # - '1.2.*'
                    # - '1.3.*'
                    # - '1.4.*'
                    # - '1.5.*'
                    # - '1.6.*'
                    # - '1.7.*'
                    # - '1.8.*'
                    # - '1.9.*'
                    # - '1.10.*'
                    # - '1.11.*'
                    # - '1.12.*'
                    - '1.13.*' # Latest
                    # - '1.14.*'
        steps:
            - name: Set Clean TF Version
              env:
                  TF_ORIG: ${{ matrix.terraform }}
              run: |
                  echo "TF_SAFE_VERSION=${TF_ORIG//\*/}" >> "$GITHUB_ENV"

            - name: Checkout Source
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ needs.verify-approval.outputs.sha }}
                  persist-credentials: false

            # IQ Server 204+ requires Java 25 and its bundled jvm.options; earlier versions run on Corretto 17
            # (https://help.sonatype.com/en/java-compatibility-matrix.html)
            - name: Select Java for IQ Server
              id: java
              env:
                  NXIQ_VERSION: ${{ matrix.nxiq }}
              run: |
                  MINOR=$(echo "$NXIQ_VERSION" | cut -d. -f2)
                  if [ "$MINOR" -ge 204 ]; then
                    { echo "distribution=temurin"; echo "version=25"; echo "bundle-jvm-options=true"; } >> "$GITHUB_OUTPUT"
                  else
                    { echo "distribution=corretto"; echo "version=17"; echo "bundle-jvm-options=false"; } >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
              with:
                  distribution: ${{ steps.java.outputs.distribution }}
                  java-version: ${{ steps.java.outputs.version }}

            - name: Download & Unpack Sonatype IQ Server
              env:
                  NXIQ_LICENSE: ${{ secrets.NXIQ_LICENSE }}
                  NXIQ_VERSION: ${{ matrix.nxiq }}
              run: |
                  mkdir -p "$(dirname "$NXIQ_LICENSE_FILE")" && chmod 700 "$(dirname "$NXIQ_LICENSE_FILE")"
                  printf '%s' "$NXIQ_LICENSE" | base64 -d > "$NXIQ_LICENSE_FILE" && chmod 600 "$NXIQ_LICENSE_FILE"
                  wget --max-redirect=0 "https://download.sonatype.com/clm/server/nexus-iq-server-${NXIQ_VERSION}-bundle.tar.gz"
                  mkdir "${GITHUB_WORKSPACE}/nxiq"
                  tar xvz -f "nexus-iq-server-${NXIQ_VERSION}-bundle.tar.gz" -C "${GITHUB_WORKSPACE}/nxiq"
                  echo "licenseFile: ${NXIQ_LICENSE_FILE}" >> "${GITHUB_WORKSPACE}/nxiq/config.yml"

            - name: Start Sonatype IQ Server
              if: ${{ steps.java.outputs.bundle-jvm-options == 'true' }}
              run: java @jvm.options -jar nexus-iq-server-*.jar server config.yml 2> stderr.log &
              working-directory: "${{ github.workspace }}/nxiq"

            - name: Start Sonatype IQ Server (legacy JVM options)
              if: ${{ steps.java.outputs.bundle-jvm-options != 'true' }}
              run: |
                  java \
                    --add-opens=java.base/java.lang=ALL-UNNAMED \
                    --add-opens=java.base/java.util=ALL-UNNAMED \
                    --add-opens=java.base/java.security=ALL-UNNAMED \
                    --add-opens=java.base/sun.security.rsa=ALL-UNNAMED \
                    --add-opens=java.base/sun.security.x509=ALL-UNNAMED \
                    --add-opens=java.base/sun.security.util=ALL-UNNAMED \
                    --add-opens=java.xml/com.sun.org.apache.xerces.internal.jaxp.datatype=ALL-UNNAMED \
                    -jar nexus-iq-server-*.jar server config.yml 2> stderr.log &
              working-directory: "${{ github.workspace }}/nxiq"

            - name: Wait for SonatypeIQ Server to be ready
              run: |
                  set +e
                  sleep 20
                  READY=false
                  for i in {1..60}; do
                    STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8071/healthcheck?pretty=true")
                    CURL_EXIT=$?

                    echo "CURL Exit Code: $CURL_EXIT"

                    if [ "$CURL_EXIT" -eq 0 ]; then
                      if [ "$STATUS" -eq 200 ]; then
                          echo "✅ Received 200 OK from http://localhost:8071/healthcheck?pretty=true"
                          READY=true
                          break
                      else
                          echo "⏳ Waiting for 200 OK... Current status: $STATUS for http://localhost:8071/healthcheck?pretty=true"
                          sleep 5
                      fi
                    else
                      echo "⚠️ curl returned unexpected exit code $CURL_EXIT. Retrying... (attempt $i/60)"
                      sleep 5
                    fi
                  done
                  if [ "$READY" != "true" ]; then
                    echo "❌ Sonatype IQ Server failed to become ready - dumping diagnostics:"
                    echo "--- stderr.log ---"
                    cat "${GITHUB_WORKSPACE}/nxiq/stderr.log" 2>&1 || echo "(no stderr.log)"
                    echo "--- clm-server.log (tail) ---"
                    tail -n 200 "${GITHUB_WORKSPACE}/nxiq/log/clm-server.log" 2>&1 || echo "(no clm-server.log)"
                    exit 1
                  fi

            - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
              with:
                  go-version-file: 'go.mod'
                  cache: true

            - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
              with:
                  terraform_version: ${{ matrix.terraform }}
                  terraform_wrapper: false

            - run: go mod download

            - env:
                  IQ_SERVER_URL: "http://localhost:8070"
                  IQ_SERVER_USERNAME: "admin"
                  IQ_SERVER_PASSWORD: "admin123"
                  # Tests for features that only exist from a given release skip themselves using this
                  NXIQ_VERSION: ${{ matrix.nxiq }}
                  TF_ACC: '1'
              run: go test -v -cover ./...
              timeout-minutes: 10

            - name: Store clm-server.log
              if: success() || failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: "clm-server.log-niqm-${{ matrix.nxiq }}-terraform-${{ env.TF_SAFE_VERSION }}"
                  path: "${{ github.workspace }}/nxiq/log/clm-server.log"

    # Run acceptance tests in a matrix with Terraform CLI versions (Docker-based for IQ 205+)
    test-parallel-docker:
        name: Acc. Tests Docker (NXIQ ${{ matrix.nxiq-docker.version }} + TF ${{ matrix.terraform }})
        needs:
            - verify-approval
            - sonatype
        # Pushes to the default branch: do not run the licensed tests if the Lifecycle scan fails.
        # Dispatched (approved Pull Request) runs skip the scan, which is not a failure.
        if: ${{ !cancelled() && needs.verify-approval.result == 'success' && (needs.sonatype.result == 'success' || needs.sonatype.result == 'skipped') }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: acceptance-tests
        permissions:
            contents: read
        env:
            TF_SAFE_VERSION: ${{ matrix.terraform }}
        strategy:
            fail-fast: false
            matrix:
                nxiq-docker:
                    - version: '1.205.4'
                      image: 'sonatype/nexus-iq-server@sha256:d28e5389701e796dac76b96c52822f944d180f404389be7175e78071a8ed02e3'
                    - version: '1.206.1'
                      image: 'sonatype/nexus-iq-server@sha256:f5c2a64a0d3372f101bbdff11661efd7fd7db7c4cc06e62c489e7aeb0dd20dbc'
                    - version: '1.207.2'
                      image: 'sonatype/nexus-iq-server@sha256:5b987e60afe7a3200f8c2f43d458108b9e4cd21471ada41ca6676dc3448a3d17'
                    - version: '1.208.1'
                      image: 'sonatype/nexus-iq-server@sha256:b17f55a43cab7738a129ed15bd256593458a3caff0d8035d46c5256e87d5d29a'
                    - version: '1.209.1' # LATEST
                      image: 'sonatype/nexus-iq-server@sha256:e3b3fc21664dd7759b4eb0f191b17020d8ce0b20fd6d66dc41817b4bce26168c'
                # list whatever Terraform versions here you would like to support
                terraform:
                    - '1.0.*' # Minimum
                    # - '1.1.*'
                    # - '1.2.*'
                    # - '1.3.*'
                    # - '1.4.*'
                    # - '1.5.*'
                    # - '1.6.*'
                    # - '1.7.*'
                    # - '1.8.*'
                    # - '1.9.*'
                    # - '1.10.*'
                    # - '1.11.*'
                    # - '1.12.*'
                    - '1.13.*' # Latest
                    # - '1.14.*'
        steps:
            - name: Set Clean TF Version
              env:
                  TF_ORIG: ${{ matrix.terraform }}
              run: |
                  echo "TF_SAFE_VERSION=${TF_ORIG//\*/}" >> "$GITHUB_ENV"

            - name: Checkout Source
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ needs.verify-approval.outputs.sha }}
                  persist-credentials: false

            - name: Setup License File
              env:
                  NXIQ_LICENSE: ${{ secrets.NXIQ_LICENSE }}
              run: |
                  mkdir -p "$(dirname "$NXIQ_LICENSE_FILE")" && chmod 755 "$(dirname "$NXIQ_LICENSE_FILE")"
                  printf '%s' "$NXIQ_LICENSE" | base64 -d > "$NXIQ_LICENSE_FILE"
                  # Readable by the (non-root) user the container runs as; the runner is ephemeral and the file is outside the workspace
                  chmod 644 "$NXIQ_LICENSE_FILE"

            # Start from the image's own default configuration and add the licence to it
            - name: Create IQ Server Config
              env:
                  NXIQ_IMAGE: ${{ matrix.nxiq-docker.image }}
              run: |
                  docker run --rm --entrypoint cat "$NXIQ_IMAGE" /etc/nexus-iq-server/config.yml > "${RUNNER_TEMP}/nxiq-config.yml"
                  echo "licenseFile: ${NXIQ_LICENSE_FILE}" >> "${RUNNER_TEMP}/nxiq-config.yml"
                  chmod 644 "${RUNNER_TEMP}/nxiq-config.yml"

            - name: Start Sonatype IQ Server Container
              env:
                  NXIQ_IMAGE: ${{ matrix.nxiq-docker.image }}
              run: |
                  docker run -d \
                    --name nxiq \
                    -p 8070:8070 \
                    -p 8071:8071 \
                    -v "${RUNNER_TEMP}/nxiq-config.yml:/etc/nexus-iq-server/config.yml:ro" \
                    -v "${NXIQ_LICENSE_FILE}:${NXIQ_LICENSE_FILE}:ro" \
                    "$NXIQ_IMAGE"

            - name: Wait for SonatypeIQ Server to be ready
              run: |
                  set +e
                  sleep 20
                  while true; do
                    STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8071/healthcheck?pretty=true")
                    CURL_EXIT=$?

                    echo "CURL Exit Code: $CURL_EXIT"

                    if [ "$CURL_EXIT" -eq 0 ]; then
                      if [ "$STATUS" -eq 200 ]; then
                          echo "✅ Received 200 OK from http://localhost:8071/healthcheck?pretty=true"
                          break
                      else
                          echo "⏳ Waiting for 200 OK... Current status: $STATUS for http://localhost:8071/healthcheck?pretty=true"
                          sleep 5
                      fi
                    else
                      echo "⚠️ curl returned unexpected exit code $CURL_EXIT. Retrying..."
                      sleep 5
                    fi
                  done

            - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
              with:
                  go-version-file: 'go.mod'
                  cache: true

            - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
              with:
                  terraform_version: ${{ matrix.terraform }}
                  terraform_wrapper: false

            - run: go mod download

            # The matrix holds image digests, so ask the running server which release it is
            - name: Detect Sonatype IQ Server version
              id: iq-version
              run: |
                  SERVER=$(curl -s -D - -o /dev/null -u admin:admin123 "http://localhost:8070/api/v2/users/admin" \
                    | tr -d '\r' | awk -F': ' 'tolower($1) == "server" {print $2}')
                  VERSION=${SERVER#NexusIQ/}
                  if ! [[ "$VERSION" =~ ^1\.[0-9]+\.[0-9]+-[0-9]+$ ]]; then
                    echo "::error::Cannot determine the Sonatype IQ Server version from the Server header '${SERVER}'"; exit 1
                  fi
                  echo "Testing Sonatype IQ Server ${VERSION}"
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

            - env:
                  IQ_SERVER_URL: "http://localhost:8070"
                  IQ_SERVER_USERNAME: "admin"
                  IQ_SERVER_PASSWORD: "admin123"
                  # Tests for features that only exist from a given release skip themselves using this
                  NXIQ_VERSION: ${{ steps.iq-version.outputs.version }}
                  TF_ACC: '1'
              run: go test -v -cover ./...
              timeout-minutes: 10

            - name: Copy clm-server.log from container
              if: success() || failure()
              run: docker cp nxiq:/var/log/nexus-iq-server/clm-server.log "${RUNNER_TEMP}/clm-server.log" || true

            - name: Store clm-server.log
              if: success() || failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: "clm-server.log-docker-${{ matrix.nxiq-docker.version }}-terraform-${{ env.TF_SAFE_VERSION }}"
                  path: "${{ runner.temp }}/clm-server.log"
                  if-no-files-found: ignore

    # Report the result against the tested commit, so it shows on the Pull Request
    report:
        name: Report Status
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        needs:
            - verify-approval
            - test-parallel
            - test-parallel-docker
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            statuses: write
        env:
            GH_TOKEN: ${{ github.token }}
            REPO: ${{ github.repository }}
            SHA: ${{ inputs.sha }}
            RESULT_BUNDLE: ${{ needs.test-parallel.result }}
            RESULT_DOCKER: ${{ needs.test-parallel-docker.result }}
            RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        steps:
            - name: Set commit status
              run: |
                  # Combine results: success if both succeed, failure if any fail
                  if [ "$RESULT_BUNDLE" = "success" ] && [ "$RESULT_DOCKER" = "success" ]; then
                    STATE=success
                    RESULT="success"
                  elif [ "$RESULT_BUNDLE" = "cancelled" ] || [ "$RESULT_DOCKER" = "cancelled" ]; then
                    STATE=error
                    RESULT="cancelled"
                  else
                    STATE=failure
                    RESULT="failure"
                  fi
                  gh api "repos/${REPO}/statuses/${SHA}" -f state="$STATE" \
                    -f context="Acceptance Tests (Licensed IQ)" -f target_url="$RUN_URL" -f description="Result: ${RESULT}"
